    <text x="36" y="152" class="nav">Брони</text>
    <text x="36" y="192" class="nav">План зала</text>
    <text x="36" y="232" class="nav">Диалоги</text>
    <text x="36" y="272" class="nav">Гости</text>
    <text x="36" y="312" class="nav">Меню и аллергены</text>
    <text x="36" y="352" class="nav">Аналитика</text>
    <text x="36" y="392" class="nav">Интеграции</text>
    <text x="36" y="432" class="nav">Настройки</text>
  </g>
  <rect x="16" y="676" width="180" height="76" rx="14" fill="#1C1817"/>
  <circle cx="44" cy="704" r="5" fill="#7FB68F"/>
  <text x="58" y="708" class="mu" fill="#B6A79B">AI на линии</text>
  <text x="32" y="732" class="mu" fill="#8A7A6E">Передать смену хостес</text>

  <!-- шапка -->
  <text x="248" y="52" class="h" font-size="22">Смена · пятница, 17 сентября</text>
  <text x="248" y="76" class="mu">Обновлено 19:42 · La Terrazza, Барселона</text>
  <rect x="884" y="34" width="132" height="38" rx="12" fill="#FFFFFF" stroke="#E6DACA"/>
  <text x="904" y="58" class="v" font-size="12">Сегодня ▾</text>
  <rect x="1028" y="34" width="144" height="38" rx="12" fill="url(#dAcc)"/>
  <text x="1100" y="58" class="h" font-size="12.5" fill="#1A1715" text-anchor="middle">Добавить бронь</text>

