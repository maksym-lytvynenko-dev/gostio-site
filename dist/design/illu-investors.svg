<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620"
     font-family="Manrope, Inter, system-ui, sans-serif" role="img"
     aria-label="Иллюстрация для инвесторов: рынок, рост выручки и юнит-экономика">
  <defs>
    <linearGradient id="iAcc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C2643C"/><stop offset=".5" stop-color="#E08A5C"/><stop offset="1" stop-color="#EFAA85"/>
    </linearGradient>
    <linearGradient id="iFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E08A5C" stop-opacity=".30"/><stop offset="1" stop-color="#E08A5C" stop-opacity="0"/>
    </linearGradient>
    <style>
      .s{fill:#1C1817;stroke:#332A25}
      .t{fill:#F4ECE3;font-size:13px;font-weight:700}
      .m{fill:#B6A79B;font-size:11.5px}
      .d{fill:#8A7A6E;font-size:10.5px}
      .big{fill:#F4ECE3;font-size:24px;font-weight:800}
      .lb{fill:#8A7A6E;font-size:10px;letter-spacing:.08em}
    </style>
  </defs>

  <rect width="900" height="620" rx="24" fill="#141110"/>

  <!-- рынок -->
  <rect x="48" y="48" width="380" height="290" rx="20" class="s"/>
  <text x="76" y="84" class="t" font-size="15">Рынок</text>
  <text x="76" y="106" class="d">рестораны Европы, оценка сверху вниз</text>
  <g transform="translate(238 218)">
    <circle r="104" fill="none" stroke="#3A302A" stroke-dasharray="4 6"/>
    <circle r="104" fill="#1C1817" fill-opacity=".01"/>
    <circle cy="14" r="70" fill="#211C1A" stroke="#4A3F38"/>
    <circle cy="40" r="38" fill="#2A1F18" stroke="#E08A5C" stroke-opacity=".6"/>
  </g>
  <g>
    <text x="196" y="132" class="lb">TAM</text><text x="236" y="132" class="m">€ 4,8 млрд</text>
    <text x="196" y="206" class="lb">SAM</text><text x="236" y="206" class="m">€ 900 млн</text>
    <text x="206" y="262" class="lb" fill="#EFAA85">SOM</text><text x="246" y="262" class="m" fill="#EFAA85">€ 120 млн</text>
  </g>
  <text x="76" y="318" class="d">Цифры — рабочая оценка команды, не проверенные данные рынка.</text>

  <!-- рост -->
  <rect x="452" y="48" width="400" height="290" rx="20" class="s"/>
  <text x="480" y="84" class="t" font-size="15">Повторяющаяся выручка</text>
  <text x="480" y="106" class="d">MRR, сценарий 24 месяцев</text>
  <g>
    <line x1="480" y1="290" x2="824" y2="290" stroke="#332A25"/>
    <line x1="480" y1="230" x2="824" y2="230" stroke="#262020"/>
    <line x1="480" y1="170" x2="824" y2="170" stroke="#262020"/>
    <path d="M480 290 L538 282 L596 268 L654 244 L712 206 L770 162 L824 134 L824 290 Z" fill="url(#iFill)"/>
    <path d="M480 290 L538 282 L596 268 L654 244 L712 206 L770 162 L824 134"
          fill="none" stroke="url(#iAcc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="824" cy="134" r="5" fill="#EFAA85"/>
    <text x="480" y="308" class="d">старт</text>
    <text x="652" y="308" class="d" text-anchor="middle">12 мес</text>
    <text x="824" y="308" class="d" text-anchor="end">24 мес</text>
    <rect x="700" y="100" width="124" height="26" rx="13" fill="#211C1A"/>
    <text x="762" y="118" class="d" fill="#EFAA85" text-anchor="middle">× 7 за два года</text>
  </g>

  <!-- юнит-экономика -->
  <g>
    <rect x="48" y="360" width="190" height="104" rx="16" class="s"/>
    <text x="72" y="388" class="lb">ARPU</text><text x="72" y="422" class="big">€ 280</text><text x="72" y="444" class="d">в месяц с ресторана</text>

    <rect x="254" y="360" width="190" height="104" rx="16" class="s"/>
    <text x="278" y="388" class="lb">CAC</text><text x="278" y="422" class="big">€ 640</text><text x="278" y="444" class="d">окупается за 3 месяца</text>

    <rect x="460" y="360" width="190" height="104" rx="16" class="s"/>
    <text x="484" y="388" class="lb">ВАЛОВАЯ МАРЖА</text><text x="484" y="422" class="big">72%</text><text x="484" y="444" class="d">после стоимости звонков</text>

    <rect x="666" y="360" width="186" height="104" rx="16" rx="16" fill="#1C1817" stroke="#E08A5C" stroke-opacity=".4"/>
    <text x="690" y="388" class="lb" fill="#EFAA85">LTV / CAC</text><text x="690" y="422" class="big">5,4</text><text x="690" y="444" class="d">при оттоке 2,5% в месяц</text>
  </g>

  <!-- защита -->
  <rect x="48" y="484" width="804" height="88" rx="20" class="s"/>
  <text x="76" y="516" class="t">Что защищает позицию</text>
  <g>
    <text x="76" y="544" class="m">Данные диалогов и посадок</text>
    <text x="300" y="544" class="m">Глубокие интеграции с POS</text>
    <text x="530" y="544" class="m">Голос на 5 языках</text>
    <text x="712" y="544" class="m">Хранение в ЕС, GDPR</text>
  </g>
  <g fill="#E08A5C">
    <circle cx="64" cy="540" r="3"/><circle cx="288" cy="540" r="3"/><circle cx="518" cy="540" r="3"/><circle cx="700" cy="540" r="3"/>
  </g>
</svg>
