    <circle cx="892" cy="294" r="5" fill="#E08A5C"/>
    <text x="910" y="290" class="v" font-size="12">Звонок · +34 600 ...</text>
    <text x="910" y="308" class="mu">подбирает время на субботу · 00:18</text>

    <rect x="868" y="330" width="280" height="52" rx="12" fill="#FAF6F0"/>
    <circle cx="892" cy="356" r="5" fill="#7FB68F"/>
    <text x="910" y="352" class="v" font-size="12">WhatsApp · Анна</text>
    <text x="910" y="370" class="mu">переносит бронь с 20:00 на 21:00</text>

    <rect x="868" y="392" width="280" height="30" rx="12" fill="#F7E9D6"/>
    <text x="886" y="412" class="mu" fill="#9A6A0B">1 обращение ждёт хостес — вопрос о парковке</text>
  </g>

