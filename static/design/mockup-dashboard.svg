  <text x="868" y="488" class="h" font-size="15">Откуда приходят брони</text>
  <g class="mu">
    <text x="868" y="516">Звонки</text><rect x="962" y="506" width="120" height="8" rx="4" fill="#F3EADF"/><rect x="962" y="506" width="68" height="8" rx="4" fill="url(#dAcc)"/><text x="1100" y="516">41%</text>
    <text x="868" y="542">WhatsApp</text><rect x="962" y="532" width="120" height="8" rx="4" fill="#F3EADF"/><rect x="962" y="532" width="34" height="8" rx="4" fill="url(#dAcc)"/><text x="1100" y="542">22%</text>
    <text x="868" y="568">Instagram</text><rect x="962" y="558" width="120" height="8" rx="4" fill="#F3EADF"/><rect x="962" y="558" width="22" height="8" rx="4" fill="url(#dAcc)"/><text x="1100" y="568">14%</text>
    <text x="868" y="594">Google и сайт</text><rect x="962" y="584" width="120" height="8" rx="4" fill="#F3EADF"/><rect x="962" y="584" width="28" height="8" rx="4" fill="url(#dAcc)"/><text x="1100" y="594">23%</text>
  </g>

  <!-- нижняя полоса: владельцу -->
  <rect x="248" y="624" width="924" height="128" rx="16" class="ui"/>
  <text x="272" y="656" class="h" font-size="15">Владельцу за неделю</text>
  <g>
    <text x="272" y="692" class="lb">ВЫРУЧКА ОТ БРОНЕЙ</text><text x="272" y="722" class="h" font-size="22">€ 38 400</text>
    <text x="520" y="692" class="lb">НЕЯВКИ</text><text x="520" y="722" class="h" font-size="22">4,1%</text><text x="600" y="722" class="mu" fill="#4E7A5E">было 11%</text>
    <text x="760" y="692" class="lb">ЗАПОЛНЯЕМОСТЬ</text><text x="760" y="722" class="h" font-size="22">78%</text>
    <text x="960" y="692" class="lb">СЭКОНОМЛЕНО ЧАСОВ</text><text x="960" y="722" class="h" font-size="22">31 ч</text>
  </g>
