    <rect x="724" y="96" width="222" height="104" rx="16" class="ui"/>
    <text x="748" y="124" class="lb">РЕШЕНО БЕЗ ЧЕЛОВЕКА</text>
    <text x="748" y="162" class="h" font-size="30">87%</text>
