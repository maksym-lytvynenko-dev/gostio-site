<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620"
     font-family="Manrope, Inter, system-ui, sans-serif" role="img"
     aria-label="Иллюстрация для ресторанов: пропущенные звонки превращаются в брони">
  <defs>
    <radialGradient id="rGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E08A5C" stop-opacity=".22"/><stop offset="1" stop-color="#E08A5C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFAA85"/><stop offset=".55" stop-color="#E08A5C"/><stop offset="1" stop-color="#C2643C"/>
    </linearGradient>
    <style>
      .s{fill:#1C1817;stroke:#332A25}
      .t{fill:#F4ECE3;font-size:13px;font-weight:700}
      .m{fill:#B6A79B;font-size:11.5px}
      .d{fill:#8A7A6E;font-size:10.5px}
      .big{fill:#F4ECE3;font-size:26px;font-weight:800}
    </style>
  </defs>

  <rect width="900" height="620" rx="24" fill="#141110"/>
  <ellipse cx="450" cy="300" rx="420" ry="260" fill="url(#rGlow)"/>

  <!-- ЛЕВО: что было -->
  <text x="48" y="60" class="d">БЫЛО</text>
  <g>
    <rect x="48" y="76" width="300" height="76" rx="16" class="s"/>
    <circle cx="82" cy="114" r="15" fill="#2A1618"/>
    <path d="M75 108h4l2.2 5.4-2.8 2a8.5 8.5 0 0 0 3.8 3.8l2-2.8 5.4 2.2v3.4a2.9 2.9 0 0 1-3.1 2.9 15.3 15.3 0 0 1-13-13A2.9 2.9 0 0 1 75 108Z"
          fill="none" stroke="#D96A5A" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="72" y1="104" x2="92" y2="124" stroke="#D96A5A" stroke-width="1.6" stroke-linecap="round"/>
    <text x="112" y="108" class="t">Пропущенный звонок</text>
    <text x="112" y="128" class="m">зал полон, трубку взять некому</text>

    <rect x="48" y="164" width="300" height="76" rx="16" class="s"/>
    <circle cx="82" cy="202" r="15" fill="#2A2418"/>
    <path d="M75 196h14M75 202h14M75 208h9" stroke="#E8B15C" stroke-width="1.6" stroke-linecap="round"/>
    <text x="112" y="196" class="t">Сообщение без ответа</text>
    <text x="112" y="216" class="m">Instagram и WhatsApp — до утра</text>

    <rect x="48" y="252" width="300" height="76" rx="16" class="s"/>
    <circle cx="82" cy="290" r="15" fill="#2A1618"/>
    <path d="M82 282v9M82 297v1" stroke="#D96A5A" stroke-width="2" stroke-linecap="round"/>
    <text x="112" y="284" class="t">Бронь в тетради</text>
    <text x="112" y="304" class="m">двойная посадка, спор у входа</text>

    <rect x="48" y="340" width="300" height="76" rx="16" class="s"/>
    <circle cx="82" cy="378" r="15" fill="#2A2418"/>
    <path d="M82 370v8l5 3" fill="none" stroke="#E8B15C" stroke-width="1.6" stroke-linecap="round"/>
    <text x="112" y="372" class="t">Гость не пришёл</text>
    <text x="112" y="392" class="m">никто не напомнил, стол пустой</text>
  </g>

  <!-- СТРЕЛКА -->
  <g>
    <path d="M372 246 L508 246" stroke="url(#rAcc)" stroke-width="3" stroke-linecap="round"/>
    <path d="M496 236 L510 246 L496 256" fill="none" stroke="#C2643C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(410 190)">
      <rect width="60" height="34" rx="12" fill="url(#rAcc)"/>
      <path d="M30 9a8 8 0 1 1-6.4 12.8l-1.6 4.7 4.9-1.5A8 8 0 0 1 30 9Z" fill="none" stroke="#141110" stroke-width="2.2" stroke-linejoin="round"/>
    </g>
    <text x="440" y="282" class="d" text-anchor="middle">Tavolo AI</text>
  </g>

  <!-- ПРАВО: что стало -->
  <text x="532" y="60" class="d">СТАЛО</text>
  <g>
    <rect x="532" y="76" width="320" height="120" rx="18" fill="#1C1817" stroke="#E08A5C" stroke-opacity=".4"/>
    <circle cx="566" cy="110" r="5" fill="#7FB68F"/>
    <text x="584" y="114" class="t">Отвечает с первого гудка</text>
    <text x="556" y="142" class="m">«Столик на четверых в субботу?»</text>
    <rect x="556" y="152" width="272" height="30" rx="12" fill="url(#rAcc)"/>
    <text x="572" y="172" class="t" fill="#1A1715" font-size="12">Есть стол у окна в 20:15. Записать?</text>

    <rect x="532" y="208" width="152" height="96" rx="16" class="s"/>
    <text x="556" y="240" class="big">0</text>
    <text x="556" y="264" class="m">пропущенных</text>
    <text x="556" y="282" class="d">звонков за смену</text>

    <rect x="700" y="208" width="152" height="96" rx="16" class="s"/>
    <text x="724" y="240" class="big">87%</text>
    <text x="724" y="264" class="m">обращений</text>
    <text x="724" y="282" class="d">без участия хостес</text>

    <rect x="532" y="316" width="152" height="96" rx="16" class="s"/>
    <text x="556" y="348" class="big">4,1%</text>
    <text x="556" y="372" class="m">неявок</text>
    <text x="556" y="390" class="d">было 11%</text>

    <rect x="700" y="316" width="152" height="96" rx="16" class="s"/>
    <text x="724" y="348" class="big">31 ч</text>
    <text x="724" y="372" class="m">времени команды</text>
    <text x="724" y="390" class="d">возвращается в зал</text>
  </g>

  <!-- НИЗ: интеграция -->
  <rect x="48" y="452" width="804" height="120" rx="20" class="s"/>
  <text x="76" y="486" class="t" font-size="14">Работает поверх того, что уже есть в ресторане</text>
  <text x="76" y="510" class="m">Тот же номер телефона, те же аккаунты в соцсетях, та же POS-система. Подключение — за неделю.</text>
  <g>
    <rect x="76" y="524" width="122" height="28" rx="14" fill="#211C1A"/><text x="137" y="542" class="d" text-anchor="middle" fill="#EFE4D6">Ваш номер</text>
    <rect x="208" y="524" width="122" height="28" rx="14" fill="#211C1A"/><text x="269" y="542" class="d" text-anchor="middle" fill="#EFE4D6">iiko · r_keeper</text>
    <rect x="340" y="524" width="122" height="28" rx="14" fill="#211C1A"/><text x="401" y="542" class="d" text-anchor="middle" fill="#EFE4D6">Poster · Square</text>
    <rect x="472" y="524" width="122" height="28" rx="14" fill="#211C1A"/><text x="533" y="542" class="d" text-anchor="middle" fill="#EFE4D6">Google Reserve</text>
    <rect x="604" y="524" width="122" height="28" rx="14" fill="#211C1A"/><text x="665" y="542" class="d" text-anchor="middle" fill="#EFE4D6">Виджет на сайте</text>
    <rect x="736" y="524" width="92" height="28" rx="14" fill="#211C1A"/><text x="782" y="542" class="d" text-anchor="middle" fill="#EFE4D6">5 языков</text>
  </g>
</svg>
