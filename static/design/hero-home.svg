<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740"
     font-family="Manrope, Inter, system-ui, sans-serif" role="img"
     aria-label="Входящий звонок превращается в бронь: разговор слева, план зала с занятым столом справа">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E08A5C" stop-opacity=".28"/><stop offset="1" stop-color="#E08A5C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFAA85"/><stop offset=".55" stop-color="#E08A5C"/><stop offset="1" stop-color="#C2643C"/>
    </linearGradient>
    <style>
      .surf{fill:#1C1817;stroke:#332A25}
      .t{fill:#F4ECE3;font-size:13px;font-weight:600}
      .m{fill:#B6A79B;font-size:11.5px}
      .d{fill:#8A7A6E;font-size:10.5px}
      .b{fill:#F4ECE3;font-size:13px;font-weight:800}
      .tbl{fill:#211C1A;stroke:#3A302A}
      .tnum{fill:#B6A79B;font-size:11px;font-weight:700;text-anchor:middle}
    </style>
  </defs>

  <ellipse cx="560" cy="330" rx="520" ry="330" fill="url(#glow)"/>

  <!-- ТЕЛЕФОН: живой разговор -->
  <g>
    <rect x="40" y="60" width="330" height="620" rx="40" fill="#141110" stroke="#332A25" stroke-width="1.5"/>
    <rect x="52" y="72" width="306" height="596" rx="32" fill="#141110"/>
    <rect x="150" y="84" width="110" height="18" rx="9" fill="#1C1817"/>

    <!-- входящий звонок -->
    <rect x="68" y="118" width="274" height="86" rx="18" class="surf"/>
    <circle cx="104" cy="152" r="18" fill="#211C1A"/>
    <path d="M97 146h4l2.6 6.4-3.3 2.4a10 10 0 0 0 4.5 4.5l2.4-3.3 6.4 2.6v4a3.4 3.4 0 0 1-3.7 3.4 18 18 0 0 1-15.3-15.3A3.4 3.4 0 0 1 97 146Z"
          fill="none" stroke="#E08A5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="146" class="t">Входящий звонок</text>
    <text x="134" y="164" class="m">+34 600 12 34 56</text>
    <text x="134" y="182" class="d">Отвечено за 1 гудок · 00:24</text>
    <circle cx="322" cy="140" r="4" fill="#7FB68F"/>
    <text x="316" y="182" class="d" text-anchor="end" fill="#7FB68F">в эфире</text>

    <!-- диалог -->
    <g>
      <rect x="68" y="224" width="222" height="52" rx="16" fill="#211C1A"/>
      <text x="86" y="246" class="t" font-weight="500">Столик на четверых</text>
      <text x="86" y="264" class="t" font-weight="500">в субботу в 20:00?</text>
      <text x="86" y="292" class="d">Гость · 20:41</text>

      <rect x="120" y="306" width="222" height="70" rx="16" fill="url(#hAcc)"/>
      <text x="138" y="328" class="t" fill="#1A1715">В 20:00 занято,</text>
      <text x="138" y="346" class="t" fill="#1A1715">но есть стол у окна</text>
      <text x="138" y="364" class="t" fill="#1A1715">в 20:15. Подойдёт?</text>
      <text x="336" y="392" class="d" text-anchor="end">Tavolo AI · 0,6 с</text>

      <rect x="68" y="406" width="222" height="52" rx="16" fill="#211C1A"/>
      <text x="86" y="428" class="t" font-weight="500">Да. И один гость</text>
      <text x="86" y="446" class="t" font-weight="500">без глютена.</text>
      <text x="86" y="474" class="d">Гость · 20:41</text>

      <rect x="120" y="488" width="222" height="70" rx="16" fill="url(#hAcc)"/>
      <text x="138" y="510" class="t" fill="#1A1715">Записала: стол 12,</text>
      <text x="138" y="528" class="t" fill="#1A1715">20:15, 4 гостя,</text>
      <text x="138" y="546" class="t" fill="#1A1715">пометка «без глютена».</text>
      <text x="336" y="574" class="d" text-anchor="end">Подтверждение в WhatsApp</text>
    </g>

    <!-- строка ввода -->
    <rect x="68" y="592" width="274" height="44" rx="22" fill="#1C1817" stroke="#332A25"/>
    <circle cx="96" cy="614" r="4" fill="#E08A5C"/><circle cx="110" cy="614" r="4" fill="#E08A5C" opacity=".6"/><circle cx="124" cy="614" r="4" fill="#E08A5C" opacity=".3"/>
    <text x="142" y="619" class="d">распознаёт речь и отвечает голосом</text>
  </g>

  <!-- ПЛАН ЗАЛА -->
  <g>
    <rect x="420" y="90" width="740" height="470" rx="28" class="surf"/>
    <text x="452" y="132" class="b" font-size="15">План зала · сегодня, 20:15</text>
    <text x="452" y="154" class="m">Основной зал · терраса</text>
    <g>
      <rect x="946" y="112" width="86" height="28" rx="14" fill="#211C1A"/><circle cx="966" cy="126" r="4" fill="#7FB68F"/><text x="978" y="130" class="d" fill="#B6A79B">свободно</text>
      <rect x="1042" y="112" width="86" height="28" rx="14" fill="#211C1A"/><circle cx="1062" cy="126" r="4" fill="#E08A5C"/><text x="1074" y="130" class="d" fill="#B6A79B">бронь</text>
    </g>

    <!-- зона: основной зал -->
    <rect x="452" y="176" width="420" height="352" rx="20" fill="#1A1715" stroke="#332A25"/>
    <text x="472" y="202" class="d">ОСНОВНОЙ ЗАЛ</text>
    <g>
      <rect x="480" y="218" width="64" height="64" rx="14" class="tbl"/><text x="512" y="254" class="tnum">2</text>
      <rect x="576" y="218" width="64" height="64" rx="14" class="tbl"/><text x="608" y="254" class="tnum">4</text>
      <rect x="672" y="218" width="64" height="64" rx="14" class="tbl"/><text x="704" y="254" class="tnum">6</text>
      <circle cx="800" cy="250" r="32" class="tbl"/><text x="800" y="254" class="tnum">8</text>

      <rect x="480" y="310" width="64" height="64" rx="14" class="tbl"/><text x="512" y="346" class="tnum">9</text>
      <circle cx="608" cy="342" r="32" class="tbl"/><text x="608" y="346" class="tnum">10</text>
      <rect x="672" y="310" width="64" height="64" rx="14" class="tbl"/><text x="704" y="346" class="tnum">11</text>

      <!-- выбранный стол 12 -->
      <circle cx="800" cy="342" r="40" fill="#E08A5C" fill-opacity=".14" stroke="#E08A5C" stroke-width="2"/>
      <circle cx="800" cy="342" r="52" fill="none" stroke="#E08A5C" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="4 6"/>
      <text x="800" y="347" class="tnum" fill="#EFAA85" font-size="13">12</text>
      <circle cx="764" cy="306" r="5" fill="#EFAA85"/><circle cx="836" cy="306" r="5" fill="#EFAA85"/>
      <circle cx="764" cy="378" r="5" fill="#EFAA85"/><circle cx="836" cy="378" r="5" fill="#EFAA85"/>

      <rect x="480" y="410" width="160" height="64" rx="14" class="tbl"/><text x="560" y="446" class="tnum">14 · длинный стол</text>
      <rect x="672" y="410" width="64" height="64" rx="14" class="tbl"/><text x="704" y="446" class="tnum">15</text>
      <rect x="768" y="410" width="64" height="64" rx="14" class="tbl"/><text x="800" y="446" class="tnum">16</text>
    </g>

    <!-- карточка брони -->
    <rect x="896" y="176" width="232" height="230" rx="20" fill="#211C1A" stroke="#E08A5C" stroke-opacity=".45"/>
    <text x="920" y="208" class="d" fill="#EFAA85">НОВАЯ БРОНЬ</text>
    <text x="920" y="238" class="b" font-size="18">Стол 12 · 20:15</text>
    <text x="920" y="262" class="m">4 гостя · 1 ч 45 мин</text>
    <line x1="920" y1="278" x2="1104" y2="278" stroke="#3A302A"/>
    <text x="920" y="302" class="t">Мария Р.</text>
    <text x="920" y="322" class="m">+34 600 12 34 56</text>
    <rect x="920" y="336" width="112" height="24" rx="12" fill="#2A1F18" stroke="#E08A5C" stroke-opacity=".4"/>
    <text x="932" y="352" class="d" fill="#EFAA85">без глютена</text>
    <text x="920" y="384" class="m" fill="#7FB68F">Подтверждена · отправлена в POS</text>

    <!-- терраса -->
    <text x="920" y="438" class="d">ТЕРРАСА</text>
    <g>
      <circle cx="936" cy="484" r="22" class="tbl"/><text x="936" y="488" class="tnum">21</text>
      <circle cx="996" cy="484" r="22" class="tbl"/><text x="996" y="488" class="tnum">22</text>
      <circle cx="1056" cy="484" r="22" class="tbl"/><text x="1056" y="488" class="tnum">23</text>
      <rect x="1094" y="462" width="34" height="44" rx="10" fill="#1C1817" stroke="#332A25" stroke-dasharray="4 4"/>
      <text x="1111" y="488" class="tnum" font-size="9">блок</text>
    </g>
  </g>

  <!-- полоса каналов под планом -->
  <g>
    <rect x="420" y="588" width="740" height="92" rx="20" class="surf"/>
    <text x="452" y="620" class="b" font-size="13">Один и тот же ответ во всех каналах</text>
    <text x="452" y="642" class="m">телефон · Instagram · WhatsApp · Google · сайт · POS</text>
    <g>
      <rect x="452" y="652" width="94" height="18" rx="9" fill="#211C1A"/><text x="499" y="665" class="d" text-anchor="middle">24/7</text>
      <rect x="556" y="652" width="130" height="18" rx="9" fill="#211C1A"/><text x="621" y="665" class="d" text-anchor="middle">ответ меньше 800 мс</text>
      <rect x="696" y="652" width="150" height="18" rx="9" fill="#211C1A"/><text x="771" y="665" class="d" text-anchor="middle">передача хостес в один шаг</text>
    </g>
    <g transform="translate(980 604)">
      <rect width="148" height="56" rx="16" fill="url(#hAcc)"/>
      <text x="74" y="34" class="b" fill="#1A1715" text-anchor="middle" font-size="14">0 пропущенных</text>
    </g>
  </g>
</svg>
