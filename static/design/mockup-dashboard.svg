<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780"
     font-family="Manrope, Inter, system-ui, sans-serif" role="img"
     aria-label="Панель ресторана: смена, брони, очередь обращений и метрики">
  <defs>
    <linearGradient id="dAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFAA85"/><stop offset=".55" stop-color="#E08A5C"/><stop offset="1" stop-color="#C2643C"/>
    </linearGradient>
    <style>
      .ui{fill:#FFFFFF;stroke:#E6DACA}
      .h{fill:#1A1715;font-weight:800}
      .mu{fill:#5F544E;font-size:11.5px}
      .lb{fill:#5F544E;font-size:10.5px;letter-spacing:.08em}
      .v{fill:#1A1715;font-size:13px;font-weight:600}
      .nav{fill:#5F544E;font-size:12.5px;font-weight:600}
    </style>
  </defs>

  <rect width="1200" height="780" rx="20" fill="#FAF6F0"/>

  <!-- сайдбар -->
  <rect x="0" y="0" width="212" height="780" rx="20" fill="#141110"/>
  <rect x="192" y="0" width="20" height="780" fill="#141110"/>
  <g transform="translate(24 26)">
