<!--
  Gostio — полный логотип (знак + начертание), тёмный фон.
  Те же оговорки про шрифт, что и в gostio-logo-light.svg:
  живой <text> в Manrope 800 работает только при инлайн-вставке в HTML
  с подключённым Manrope. Иначе — PNG gostio-logo-dark.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 536 128" width="536" height="128" role="img" aria-label="Gostio">
  <title>Gostio</title>
  <g fill="none" stroke-linecap="round" transform="translate(0 7) scale(1.78125)">
    <path d="M47.56 16.44A22 22 0 1 0 54 32" stroke="#F4ECE3" stroke-width="9"/>
    <path d="M54 32H41.5" stroke="#E08A5C" stroke-width="9"/>
  </g>
  <text x="150" y="106"
        font-family="Manrope, 'Manrope Fallback', 'Segoe UI', system-ui, sans-serif"
        font-size="120" font-weight="800" letter-spacing="-3" fill="#F4ECE3">Gostio</text>
</svg>
