    <path d="M15 7.5a7 7 0 1 1-5.6 11.2l-1.4 4.1 4.3-1.3A7 7 0 0 1 15 7.5Z" fill="none" stroke="#141110" stroke-width="2" stroke-linejoin="round"/>
    <text x="42" y="21" class="h" fill="#F4ECE3" font-size="15">tavolo<tspan fill="#E08A5C">.ai</tspan></text>
  </g>
  <g>
