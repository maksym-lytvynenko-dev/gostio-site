      <rect x="712" y="454" width="92" height="22" rx="11" fill="#E9F0E9"/><text x="758" y="469" class="mu" fill="#4E7A5E" text-anchor="middle">подтверждена</text>
    </g>
    <line x1="272" y1="488" x2="804" y2="488" stroke="#F3EADF"/>
